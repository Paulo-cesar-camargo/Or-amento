<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Planilha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">
</head>
<body>

<header class="topo">
  <button class="theme-btn" onclick="setTema('light')">☀️</button>
  <span class="bungee-spice-regular">📊 CONTROLE FINANCEIRO 📊</span>
  <button class="theme-btn" onclick="setTema('dark')">🌙</button>
</header>

<main class="container">

  <!-- SELEÇÃO DO MÊS -->
  <section class="mes">
    <input type="month" id="mesSelecionado">
    <button onclick="carregarMes()">Carregar</button>
    <button class="fechar" onclick="fecharMes()">Fechar Mês</button>
  </section>

  <!-- FORMULÁRIO -->
  <section class="form">
    <input type="date" id="data">
    <input type="text" id="descricao" placeholder="Descrição">
    <select id="tipo">
      <option value="entrada">Entrada</option>
      <option value="saida">Saída</option>
    </select>
    <input type="number" id="valor" placeholder="Valor" step="0.01">
    <button onclick="adicionarRegistro()">Adicionar</button>
  </section>

  <!-- TABELA -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Descrição</th>
        <th>Entrada</th>
        <th>Saída</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <!-- RESUMO FINANCEIRO -->
  <section class="resumo">
    <p>Total de Entradas:
      <strong id="totalEntradas">R$ 0,00</strong>
    </p>

    <p>Total de Saídas:
      <strong id="totalSaidas">R$ 0,00</strong>
    </p>

    <p class="saldo-final">
      Saldo Total:
      <strong id="saldoTotal">R$ 0,00</strong>
    </p>
  </section>

  <!-- IMPRESSÃO -->
  <button class="imprimir" onclick="imprimirMes()">🖨️ Imprimir Mês</button>

</main>

<script src="script.js"></script>
<script>
  if (localStorage.getItem("logado") !== "true") {
    window.location.href = "login.html";
  }
</script>

</body>
</html>
